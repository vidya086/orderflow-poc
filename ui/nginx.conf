server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # In-cluster: proxy API calls straight to the gateway Service via K8s DNS.
    # This mirrors what the Ingress does at the edge, but lets the container
    # itself work if hit directly (e.g. via port-forward) too.
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
