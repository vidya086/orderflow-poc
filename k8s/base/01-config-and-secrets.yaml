# Non-secret config. In a real environment split by service to avoid a
# monolithic ConfigMap becoming a merge-conflict magnet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-config
  namespace: orderflow
data:
  RABBITMQ_HOST: "rabbitmq"
  ORDER_SERVICE_HOST: "order-service"
  ORDER_SERVICE_PORT: "8081"
  INVENTORY_SERVICE_HOST: "inventory-service"
  INVENTORY_SERVICE_PORT: "8082"
---
# TEACHING NOTE: these are plaintext Secrets for Stage 1 only, so you can
# see the full manifest with nothing hidden. From Stage 2 onward, replace
# this with Secret Manager (GCP) / Key Vault (Azure) + External Secrets
# Operator (Stage 8) - never commit real credentials like this to git.
apiVersion: v1
kind: Secret
metadata:
  name: order-db-secret
  namespace: orderflow
type: Opaque
stringData:
  DB_HOST: "10.149.208.3"
  DB_PORT: "5432"
  DB_NAME: "orderdb"
  DB_USER: "order_user"
  DB_PASSWORD: "order_pass"
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-secret
  namespace: orderflow
type: Opaque
stringData:
  DB_HOST: "10.149.208.3"
  DB_PORT: "5432"
  DB_NAME: "inventorydb"
  DB_USER: "inventory_user"
  DB_PASSWORD: "inventory_pass"
