apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: orderflow
spec:
  replicas: 2
  selector: { matchLabels: { app: ui } }
  template:
    metadata: { labels: { app: ui } }
    spec:
      enableServiceLinks: false
      containers:
        - name: ui
          image: asia-south1-docker.pkg.dev/my-first-gcp-project-vbmpr1/orderflow/orderflow-ui:v1
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: orderflow
spec:
  selector: { app: ui }
  ports: [{ port: 80, targetPort: 80 }]
