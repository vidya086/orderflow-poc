apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: orderflow
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      enableServiceLinks: false
      containers:
        - name: notification-service
          image: asia-south1-docker.pkg.dev/my-first-gcp-project-vbmpr1/orderflow/notification-service:v2
          ports: [{ containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: orderflow-config }
          resources:
            requests: { cpu: "250m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 60
            periodSeconds: 20
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: orderflow
spec:
  selector: { app: notification-service }
  ports: [{ port: 8083, targetPort: 8083 }]
