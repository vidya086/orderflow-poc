apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orderflow
spec:
  replicas: 1
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      enableServiceLinks: false
      containers:
        - name: order-service
          # Stage 1: build locally and load into your cluster, e.g.
          #   docker build -t order-service:local ./services/order-service
          # Stage 1+ on GKE: push to Artifact Registry and replace this with
          #   asia-south1-docker.pkg.dev/<project>/orderflow/order-service:<tag>
          image: asia-south1-docker.pkg.dev/my-first-gcp-project-vbmpr1/orderflow/order-service:v2
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: orderflow-config }
            - secretRef: { name: order-db-secret }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orderflow
spec:
  selector: { app: order-service }
  ports: [{ port: 8081, targetPort: 8081 }]
