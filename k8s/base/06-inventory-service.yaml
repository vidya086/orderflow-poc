apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: orderflow
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory-service } }
  template:
    metadata: { labels: { app: inventory-service } }
    spec:
      enableServiceLinks: false
      containers:
        - name: inventory-service
          image:  asia-south1-docker.pkg.dev/my-first-gcp-project-vbmpr1/orderflow/inventory-service:v2
          ports: [{ containerPort: 8082 }]
          envFrom:
            - configMapRef: { name: orderflow-config }
            - secretRef: { name: inventory-db-secret }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 20
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: orderflow
spec:
  selector: { app: inventory-service }
  ports: [{ port: 8082, targetPort: 8082 }]
