apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: orderflow
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: asia-south1-docker.pkg.dev/my-first-gcp-project-vbmpr1/orderflow/orderflow-api-gateway:v1
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: orderflow-config }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: orderflow
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
