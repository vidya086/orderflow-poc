# STAGE 1 ONLY: in-cluster Postgres so you can learn StatefulSets + PVCs
# before adding Cloud SQL networking complexity. In Stage 2 you delete this
# and point DB_HOST at a Cloud SQL Auth Proxy sidecar or private IP instead.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: orderflow
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init-script
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: orderflow
spec:
  clusterIP: None   # headless - StatefulSet gets a stable DNS identity
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
