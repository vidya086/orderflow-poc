version: "3.9"

networks:
  orderflow-net:
    driver: bridge

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks: [orderflow-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    networks: [orderflow-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [orderflow-net]

  order-service:
    build: ./services/order-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: orderdb
      DB_USER: order_user
      DB_PASSWORD: order_pass
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "8081:8081"
    networks: [orderflow-net]

  inventory-service:
    build: ./services/inventory-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventorydb
      DB_USER: inventory_user
      DB_PASSWORD: inventory_pass
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "8082:8082"
    networks: [orderflow-net]

  notification-service:
    build: ./services/notification-service
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq: { condition: service_healthy }
    ports:
      - "8083:8083"
    networks: [orderflow-net]

  api-gateway:
    build: ./services/api-gateway
    environment:
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 8081
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: 8082
    depends_on:
      - order-service
      - inventory-service
    ports:
      - "8080:8080"
    networks: [orderflow-net]

  # Builds and serves the production React bundle via nginx (see ui/Dockerfile),
  # with nginx proxying /api/* to the gateway container by its compose service
  # name - the same pattern the K8s Service DNS name will provide later.
  ui:
    build: ./ui
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks: [orderflow-net]
