name: Build and Deploy OrderFlow

on:
  push:
    branches: [master]
    paths-ignore:
      - 'k8s/base/**'   # prevents the update-manifests job's own commits from re-triggering this workflow

env:
  REGION: asia-south1
  PROJECT_ID: my-first-gcp-project-vbmpr1
  REGISTRY: asia-south1-docker.pkg.dev/my-first-gcp-project-vbmpr1/orderflow
  WIF_PROVIDER: projects/623761784764/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: orderflow-ci@my-first-gcp-project-vbmpr1.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, notification-service, api-gateway, ui]
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Determine build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "ui" ]; then
            echo "path=ui" >> "$GITHUB_OUTPUT"
          else
            echo "path=services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
          docker build -t "$IMAGE" ${{ steps.ctx.outputs.path }}
          docker push "$IMAGE"

  # Replaces the old kubectl-based deploy job entirely. This job never
  # touches the Kubernetes API - it only edits git. ArgoCD, running inside
  # the cluster, is what actually applies the change - solving the private
  # control-plane access problem by removing the need for CI to reach the
  # cluster network at all.
  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Bump image tags to this commit's SHA
        working-directory: k8s/base
        run: |
          for svc in order-service inventory-service notification-service api-gateway ui; do
            kustomize edit set image ${{ env.REGISTRY }}/${svc}=${{ env.REGISTRY }}/${svc}:${{ github.sha }}
          done

      - name: Commit and push the manifest change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No image changes - nothing to commit"
            exit 0
          fi
          git commit -m "deploy: bump images to ${{ github.sha }}"
          git push