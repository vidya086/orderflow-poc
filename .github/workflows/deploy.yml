name: Build and Deploy OrderFlow

on:
  push:
    branches: [master]

env:
  REGION: asia-south1
  PROJECT_ID: my-first-gcp-project-vbmpr1
  CLUSTER_NAME: orderflow-gke
  CLUSTER_ZONE: asia-south1-a
  REGISTRY: asia-south1-docker.pkg.dev/my-first-gcp-project-vbmpr1/orderflow
  # From `gcloud iam workload-identity-pools providers describe ...` output above
  WIF_PROVIDER: projects/623761784764/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: orderflow-ci@my-first-gcp-project-vbmpr1.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write   # this is what lets GitHub mint the OIDC token WIF trusts

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, notification-service, api-gateway, ui]
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Determine build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "ui" ]; then
            echo "path=ui" >> "$GITHUB_OUTPUT"
          else
            echo "path=services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}"
          docker build -t "$IMAGE" ${{ steps.ctx.outputs.path }}
          docker push "$IMAGE"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}

      - name: Point each Deployment at the freshly-built, SHA-tagged image
        run: |
          for svc in order-service inventory-service notification-service api-gateway ui; do
            kubectl -n orderflow set image deployment/${svc} ${svc}=${{ env.REGISTRY }}/${svc}:${{ github.sha }}
          done

      - name: Wait for rollout to actually succeed (fail the pipeline if it doesn't)
        run: |
          for svc in order-service inventory-service notification-service api-gateway ui; do
            kubectl -n orderflow rollout status deployment/${svc} --timeout=180s
          done
